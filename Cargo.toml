[workspace]
members = [
    "crates/relief-model",
    "crates/relief-bridge",
    "crates/relief-interaction",
    "crates/relief-ai-contract",
    "crates/relief-resolver",
    "crates/relief-cdp",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
a11y-perception = "0.1"
a11y-dom = "0.13"
a11y-report = "0.13"
a11y-rules = { version = "0.13", features = ["de"] }
accname = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
relief-ai-contract = { path = "crates/relief-ai-contract" }
relief-interaction = { path = "crates/relief-interaction" }
relief-model = { path = "crates/relief-model" }
