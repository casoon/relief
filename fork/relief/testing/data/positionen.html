<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Positionen</title>
<style>
  body { margin: 0; height: 3000px; }
  #fest { position: absolute; left: 100px; top: 1200px; width: 80px; height: 30px; }
  #kasten { position: absolute; left: 20px; top: 50px; width: 200px; height: 100px; overflow: auto; }
  #innen { height: 400px; position: relative; }
  #tief { position: absolute; left: 10px; top: 150px; width: 60px; height: 20px; }
</style></head>
<body>
<button id="fest">Fest</button>
<div id="kasten" role="region" aria-label="Kasten"><div id="innen"><button id="tief">Tief</button></div></div>
</body></html>
